# Puts a "Sponsor" button at the top of the repository.
#
# `custom` takes any address and needs no account beyond the one you already
# have. It can be swapped for GitHub Sponsors later without touching anything
# else — the alternatives below stay commented out until then.

custom: ["https://paypal.me/computi71"]

# GitHub Sponsors — the button lives on GitHub and payments run through it.
# Needs a one-time signup: identity check, bank details via Stripe, tax form.
# github: [computi71]

# Ko-fi, Buy Me a Coffee, Liberapay — an account, no paperwork.
# ko_fi: YOUR-NAME
# buy_me_a_coffee: YOUR-NAME
# liberapay: YOUR-NAME
